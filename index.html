<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0c0907">
  <title>Why Bother?</title>
  <meta name="description" content="¿Para qué tomarte el trabajo? Una película corta, hecha de simulación, sobre crear y aprender en tiempos de inteligencia artificial.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;1,9..144,300;1,9..144,400&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
  </script>
</head>
<body>
  <h1 class="sr">Why Bother?</h1>
  <canvas id="lienzo" aria-hidden="true"></canvas>
  <div id="luz" aria-hidden="true"><i></i><i></i></div>
  <div id="vineta" aria-hidden="true"></div>
  <div id="negro" aria-hidden="true"></div>
  <div class="barra-cine arriba" aria-hidden="true"></div>
  <div class="barra-cine abajo" aria-hidden="true"></div>

  <main id="capa">
    <section id="portada">
      <p id="titulo"></p>
      <p id="subtitulo"></p>
      <p id="empezar"></p>
    </section>

    <p id="verso" aria-live="polite"></p>

    <!-- Ornamentos: filigranas finas en las esquinas del cuadro -->
    <svg class="ornamento sup-izq" viewBox="0 0 120 120" aria-hidden="true"><path d="M4 116 V40 C4 18 18 4 40 4 H116 M14 116 V46 C14 26 26 14 46 14 H116 M40 4 C40 22 30 32 14 32 M30 30 c6 -2 10 2 8 8 c-2 5 -9 5 -10 0" /></svg>
    <svg class="ornamento sup-der" viewBox="0 0 120 120" aria-hidden="true"><path d="M4 116 V40 C4 18 18 4 40 4 H116 M14 116 V46 C14 26 26 14 46 14 H116 M40 4 C40 22 30 32 14 32 M30 30 c6 -2 10 2 8 8 c-2 5 -9 5 -10 0" /></svg>
    <svg class="ornamento inf-izq" viewBox="0 0 120 120" aria-hidden="true"><path d="M4 116 V40 C4 18 18 4 40 4 H116 M14 116 V46 C14 26 26 14 46 14 H116 M40 4 C40 22 30 32 14 32 M30 30 c6 -2 10 2 8 8 c-2 5 -9 5 -10 0" /></svg>
    <svg class="ornamento inf-der" viewBox="0 0 120 120" aria-hidden="true"><path d="M4 116 V40 C4 18 18 4 40 4 H116 M14 116 V46 C14 26 26 14 46 14 H116 M40 4 C40 22 30 32 14 32 M30 30 c6 -2 10 2 8 8 c-2 5 -9 5 -10 0" /></svg>
    <div id="progreso-carril" aria-hidden="true"><i id="progreso"></i></div>

    <section id="final">
      <p id="pregunta"></p>
      <div id="respuesta">
        <p id="respuesta-1"></p>
        <p id="respuesta-2"></p>
      </div>
      <p id="final-titulo"></p>
      <p id="reiniciar"></p>
    </section>

    <button id="sonido" type="button" aria-label="activar o silenciar el sonido">sonido</button>

    <aside id="ayuda" aria-hidden="true">
      <p><b>clic / espacio / →</b> adelantar</p>
      <p><b>←</b> volver a empezar</p>
      <p><b>1–7</b> saltar a un momento</p>
      <p><b>S</b> sonido · <b>H</b> esta ayuda</p>
    </aside>
  </main>

  <div id="cursor" aria-hidden="true"><i></i></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
