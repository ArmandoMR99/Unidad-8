<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0a0f">
  <title>Why Bother?</title>
  <meta name="description" content="¿Para qué tomarte el trabajo? Una obra de simulación sobre crear y aprender en tiempos de inteligencia artificial.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;1,9..144,300;1,9..144,400&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
  </script>
</head>
<body>
  <h1 class="sr">Why Bother?</h1>
  <canvas id="lienzo" aria-hidden="true"></canvas>
  <div id="vineta" aria-hidden="true"></div>

  <main id="capa">
    <section id="portada">
      <p id="titulo"></p>
      <p id="subtitulo"></p>
      <p id="empezar">espacio</p>
    </section>

    <div id="etq-humano" class="etiqueta humano">humano</div>
    <div id="etq-ia" class="etiqueta ia">ia</div>

    <p id="frase" aria-live="polite"></p>

    <section id="final">
      <p id="pregunta"></p>
      <p id="respuesta"></p>
    </section>

    <p id="firma"></p>
    <button id="sonido" type="button" aria-label="activar o silenciar el sonido">sonido</button>

    <aside id="ayuda" aria-hidden="true">
      <p><b>0–7</b> escenas</p>
      <p><b>espacio / →</b> siguiente</p>
      <p><b>←</b> anterior (reinicia)</p>
      <p><b>4</b> clic sostenido y arrastrar</p>
      <p><b>6</b> otra vez: recorrer todos</p>
      <p><b>S</b> sonido · <b>R</b> reiniciar · <b>H</b> ayuda</p>
      <p id="contador"></p>
    </aside>
  </main>

  <div id="cursor" aria-hidden="true"><i></i></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
