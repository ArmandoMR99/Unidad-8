<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0c0907">
  <title>Why Bother?</title>
  <meta name="description" content="¿Para qué tomarte el trabajo? Una película corta, hecha de simulación, sobre crear y aprender en tiempos de inteligencia artificial.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;1,9..144,300;1,9..144,400&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
  </script>
</head>
<body>
  <h1 class="sr">Why Bother?</h1>
  <canvas id="lienzo" aria-hidden="true"></canvas>
  <div id="luz" aria-hidden="true"><i></i><i></i></div>
  <div id="vineta" aria-hidden="true"></div>
  <div id="negro" aria-hidden="true"></div>
  <div class="barra-cine arriba" aria-hidden="true"></div>
  <div class="barra-cine abajo" aria-hidden="true"></div>

  <main id="capa">
    <section id="portada">
      <p id="titulo"></p>
      <p id="subtitulo"></p>
      <p id="empezar"></p>
    </section>

    <section id="tarjeta" aria-live="polite">
      <p id="tarjeta-numero"></p>
      <p id="tarjeta-titulo"></p>
    </section>

    <p id="frase" aria-live="polite"></p>
    <p id="pista"></p>
    <button id="continuar" type="button"></button>

    <section id="final">
      <p id="pregunta"></p>
      <p id="respuesta"></p>
      <p id="final-titulo"></p>
      <p id="reiniciar"></p>
    </section>

    <button id="sonido" type="button" aria-label="activar o silenciar el sonido">sonido</button>

    <aside id="ayuda" aria-hidden="true">
      <p><b>clic / espacio / →</b> continuar</p>
      <p><b>←</b> capítulo anterior (reinicia)</p>
      <p><b>0–7</b> ir a un capítulo</p>
      <p><b>S</b> sonido · <b>H</b> esta ayuda</p>
    </aside>
  </main>

  <div id="cursor" aria-hidden="true"><i></i></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
